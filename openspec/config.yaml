schema: spec-driven

context: |
  Project: A2 Atoms Demo — AI Agent 平台，用户通过自然语言描述需求，
  AI Agent 团队自动完成从需求分析到代码生成、部署上线的全流程。
  Tech stack: Next.js 15 (App Router), Tailwind CSS, shadcn/ui,
  Prisma ORM (SQLite), Zustand, Shiki, OpenAI/Anthropic/Alibaba Bailian API
  Deploy target: Vercel
  Language: TypeScript (primary), Chinese (UI copy)
  Naming convention (terminology):
  - Chinese UI copy SHALL use "项目" (not "应用") to refer to a user's generated artifact.
  - English code, specs, routes, components, and data models SHALL use Project / project
    (e.g. /my-projects, ProjectGrid, Project model, projects[]).
  - Exception: when describing the product's *output type* in marketing copy
    (e.g. "AI Agent 驱动的 Web 应用生成平台"), "应用" is acceptable because it
    refers to "Web App" as a class of artifact, not to a managed Project record.

rules:
  proposal:
    - Include scope boundaries and non-goals
    - Reference user stories by ID
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task should be independently testable

operations:
  apply:
    guidance:
      - Run linting and type checks after each task group
      - Keep test summaries concise
  archive:
    guidance:
      - Summarize the archive outcome before finishing
